# Performance gate baseline, read by `fx-bench perf-compare` and
# `fx-bench perf-release`.
#
# One table per metric of docs/gates/performance.md: the key that
# scripts/perf-check.sh writes to metrics.txt, the target, the allowance, the
# tiers that measure it and the baseline it is compared with. The quick tier
# compares with `quick_baseline` (200,000 entries) and checks no targets; the
# pr and rc tiers compare with `baseline` at gate scale.
#
# The baseline moves only at a release, from the release candidate's run
# (`fx-bench perf-compare --print-values`), or by an exception the owner
# approved, recorded in the metric's `exception` with the pull request. Never
# edit it to make a check pass (.agents/rules/performance.md).
#
# MB is 1,048,576 bytes, as Activity Monitor counts them.

[meta]
machine = "Apple M4 Pro, 24 GB, macOS 27"
cache = "warm"
build = "0.3.2"
date = "2026-11-09"
# The rows of the summary table in a release's notes (fx-bench perf-release).
summary = "B1 B4 B7 B2 M1 S1 S5 F1 F6 F2"
# Measured on the run 2.18 branch at c2622ca, whose app code is 0.3.2's
# plus measurement-only flags, with scripts/perf-check.sh --tier pr and
# --tier quick. The pr run started under load (about 9).

# --- Background cost --------------------------------------------------------

[B1]
name = "CPU, window hidden"
key = "hidden_cpu_pct"
unit = "% of a core"
better = "lower"
target = 1
allow_pct = 10
allow_floor = 0.05
aggregate = "mean"
tiers = "pr rc"
baseline = 10.389
baseline_build = "0.3.2"
baseline_date = "2026-11-09"

