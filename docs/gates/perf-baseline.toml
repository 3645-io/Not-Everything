# Performance gate baseline, read by `fx-bench perf-compare`.
#
# One table per metric of docs/gates/performance.md: the key that
# scripts/perf-check.sh writes to metrics.txt, the target, the allowance, the
# tiers that measure it and the baseline it is compared with. The quick tier
# compares with `quick_baseline` (200,000 entries) and checks no targets; the
# pr and rc tiers compare with `baseline` at gate scale.
#
# The baseline moves only at a release, from the release candidate's run
# (`fx-bench perf-compare --print-values`), or by an exception the owner
# approved, recorded in the metric's `exception` with the pull request. Never
# edit it to make a check pass (.agents/rules/performance.md).
#
# MB is 1,048,576 bytes, as Activity Monitor counts them.

[meta]
machine = "Apple M4 Pro, 24 GB, macOS 27"
cache = "warm"
build = "0.3.1"
date = "2026-11-09"

# --- Background cost --------------------------------------------------------

[B1]
name = "CPU, window hidden"
key = "hidden_cpu_pct"
unit = "% of a core"
better = "lower"
target = 1
allow_pct = 10
allow_floor = 0.05
aggregate = "mean"
tiers = "pr rc"

[B2]
name = "CPU, window showing a search"
key = "search_cpu_pct"
unit = "% of a core"
better = "lower"
target = 5
allow_pct = 10
allow_floor = 0.05
aggregate = "mean"
tiers = "pr rc"

# Target only: the busiest interval varies too much between runs for a
# regression check, so it has no baseline.
[B3]
name = "CPU, busiest 10 s interval"
key = "cpu_max_interval_pct"
unit = "% of a core"
better = "lower"
target = 100
aggregate = "max"
tiers = "pr rc"

[B4]
name = "CPU energy, window hidden"
key = "hidden_energy_mw"
unit = "mW"
better = "lower"
target = 50
allow_pct = 10
allow_floor = 5
aggregate = "mean"
tiers = "pr rc"

[B5]
name = "CPU energy, window showing a search"
key = "search_energy_mw"
unit = "mW"
better = "lower"
target = 250
allow_pct = 10
allow_floor = 5
aggregate = "mean"
tiers = "pr rc"

[B6]
name = "Wakeups a second, window hidden"
key = "hidden_wakeups_per_s"
unit = "per s"
better = "lower"
target = 2
allow_pct = 10
allow_floor = 0.5
aggregate = "mean"
tiers = "pr rc"

[B7]
name = "Disk writes, scaled to a day"
key = "disk_written_per_day_mb"
unit = "MB"
better = "lower"
target = 512
allow_pct = 5
allow_floor = 10
aggregate = "mean"
tiers = "pr rc"

