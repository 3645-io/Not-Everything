[package]
name = "fx-index"
description = "In-memory index: column store, name buffer, extension table, delta, compaction and snapshots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# Licenses checked on crates.io before adding (no GPL):
# - bytemuck: Zlib OR Apache-2.0 OR MIT (already locked through fx-store);
#   casts a saved index's mapped columns without `unsafe`
[dependencies]
bytemuck = { version = "1", default-features = false }
fx-model = { path = "../fx-model" }

[dev-dependencies]
fx-bench = { path = "../fx-bench" }

[lints]
workspace = true
