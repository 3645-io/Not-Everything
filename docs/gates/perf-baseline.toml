# The performance gate, read by `fx-bench perf-compare` and
# `fx-bench perf-release`.
#
# One table per metric of docs/gates/performance.md: the key that
# scripts/perf-check.sh writes to metrics.txt, its target, the tiers that
# measure it and the baseline shown beside it.
#
# At the pr and rc tiers a metric with a target is judged on it alone, the
# owner's decision of 14 Nov 2026: a build fails only when it misses a
# target users can feel. `target` is the measuring Mac's gate (an M4 Pro):
# 0.6 of `m1_target` for work on one core, 0.4 for search on all cores, and
# the same for sizes, counts and memory per file. `m1_target` is what the
# slowest supported Mac, a base M1 MacBook Air with 8 GB, must meet. A
# missed target the owner accepted until the work that fixes it lands is a
# `known_gap`: reported and counted, but never failing; once the target is
# met, the report asks for the gap to be removed. `per_key` and `per_scale`
# divide a metric by another key: per million files, or as a multiple of
# another metric.
#
# The quick tier compares with `quick_baseline` (200,000 entries) and checks
# no targets, and a metric without a target is compared with `baseline` (or
# `pr_baseline` at the pr tier) within its allowance. The baselines move
# only at a release, from the release candidate's run (`fx-bench
# perf-compare --print-values`). Never edit a target or a baseline to make a
# check pass (.agents/rules/performance.md).
#
# MB is 1,048,576 bytes, as Activity Monitor counts them.

[meta]
machine = "Apple M4 Pro, 24 GB, macOS 27"
cache = "warm"
build = "0.6.0"
date = "2026-11-14"
# The build and date of the `pr_baseline` values. The pr tier runs its
# background phases for 10 minutes under 20 file operations a second (`fx-bench
# churn`), the rc tier for 30 minutes without, so the background metrics
# (B1 to B6, M1, M2) carry a pr-tier baseline too: 0.5.0 at f1d1d5d measured
# with its own scripts/perf-check.sh --tier pr --step background (macOS
# 27.2.1, AC power, warm cache, display on, about 3.08M files on the disk,
# 14 Nov 2026). 0.6.0 had no pr-tier run: the owner chose on 14 Nov 2026 to
# move the gate to absolute targets in 0.7.0, so 0.5.0's stay. With a target,
# a metric's pr_baseline is shown, not judged. M1 and M2 hold it per million
# files of the phase's index (2,077,595 entries).
pr_build = "0.5.0"
pr_date = "2026-11-14"
# The rows of the summary table in a release's notes (fx-bench perf-release).
summary = "B1 B4 B7 B2 M1 S1 S5 F1 F6 F2"
# `baseline` values: the rc tier at b5855ec, the code 0.6.0-RC-1 and RC-2
# were built from (0.6.0 was built from RC-2's tree, which differs only in
# scripts, tests and the changelog; macOS 27.2.1, AC power, warm cache,
# 14 Nov 2026), with the published 0.6.0 DMG's size
# (docs/gates/releases/0.6.0.txt). 0.6.0 was released on targets: S7 and F6
# failed only their regression checks in that run and passed re-run alone,
# and their baselines now hold that run's readings. The exceptions accepted
# for 0.6.0 (S3, F3) held only until 0.6.0 and are removed. Metrics the rc
# tier doesn't judge (O2) and every `quick_baseline` keep their earlier
# values.

# --- Background cost --------------------------------------------------------

[B1]
name = "CPU, window hidden"
key = "hidden_cpu_pct"
unit = "% of a core"
better = "lower"
target = 0.06
allow_pct = 10
allow_floor = 0.05
aggregate = "mean"
tiers = "pr rc"
known_gap = "Quiet background (run 2.21): measured with the Mac's own activity until the quiet-folder phases"
m1_target = 0.1
baseline = 0.218
pr_baseline = 1.314
baseline_build = "0.6.0"
baseline_date = "2026-11-14"

