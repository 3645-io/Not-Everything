# Performance gate baseline, read by `fx-bench perf-compare` and
# `fx-bench perf-release`.
#
# One table per metric of docs/gates/performance.md: the key that
# scripts/perf-check.sh writes to metrics.txt, the target, the allowance, the
# tiers that measure it and the baseline it is compared with. The quick tier
# compares with `quick_baseline` (200,000 entries) and checks no targets; the
# rc tier compares with `baseline` at gate scale, and the pr tier with
# `pr_baseline` where a metric has one, else with `baseline`.
#
# The baseline moves only at a release, from the release candidate's run
# (`fx-bench perf-compare --print-values`), or by an exception the owner
# approved, recorded in the metric's `exception` with the pull request. Never
# edit it to make a check pass (.agents/rules/performance.md).
#
# MB is 1,048,576 bytes, as Activity Monitor counts them.

[meta]
machine = "Apple M4 Pro, 24 GB, macOS 27"
cache = "warm"
build = "0.6.0"
date = "2026-11-14"
# The build and date of the `pr_baseline` values. The pr tier runs its
# background phases for 10 minutes under 20 file operations a second (`fx-bench
# churn`), the rc tier for 30 minutes without, so the background metrics
# (B1 to B6, M1, M2) carry a pr-tier baseline too: 0.5.0 at f1d1d5d measured
# with its own scripts/perf-check.sh --tier pr --step background (macOS
# 27.2.1, AC power, warm cache, display on, about 3.08M files on the disk,
# 14 Nov 2026). 0.6.0 had no pr-tier run: the owner chose on 14 Nov 2026 to
# move the gate to absolute targets in 0.7.0, so 0.5.0's stay. B7 has none:
# it is tracked until its target is set (#29).
pr_build = "0.5.0"
pr_date = "2026-11-14"
# The rows of the summary table in a release's notes (fx-bench perf-release).
summary = "B1 B4 B7 B2 M1 S1 S5 F1 F6 F2"
# `baseline` values: the rc tier at b5855ec, the code 0.6.0-RC-1 and RC-2
# were built from (0.6.0 was built from RC-2's tree, which differs only in
# scripts, tests and the changelog; macOS 27.2.1, AC power, warm cache,
# 14 Nov 2026), with the published 0.6.0 DMG's size
# (docs/gates/releases/0.6.0.txt). 0.6.0 was released on targets: S7 and F6
# failed only their regression checks in that run and passed re-run alone,
# and their baselines now hold that run's readings. The exceptions accepted
# for 0.6.0 (S3, F3) held only until 0.6.0 and are removed. Metrics the rc
# tier doesn't judge (O2) and every `quick_baseline` keep their earlier
# values.

# --- Background cost --------------------------------------------------------

[B1]
name = "CPU, window hidden"
key = "hidden_cpu_pct"
unit = "% of a core"
better = "lower"
target = 1
allow_pct = 10
allow_floor = 0.05
aggregate = "mean"
tiers = "pr rc"
baseline = 0.218
pr_baseline = 1.314
baseline_build = "0.6.0"
baseline_date = "2026-11-14"

